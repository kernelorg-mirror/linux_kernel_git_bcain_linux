%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/qcom,h2-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Hexagon H2 Virtual Timer

maintainers:
  - Brian Cain <bcain@quicinc.com>

description:
  The H2 virtual timer provides clock event and clock source services
  for guest operating systems running under the Hexagon H2 hypervisor.
  Timer operations are performed via trap1 hypercalls (vmtimerop).

properties:
  compatible:
    const: qcom,h2-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    gpt@ab000000 {
        compatible = "qcom,h2-timer";
        reg = <0xab000000 0x1000>;
        interrupts = <12 0>;
    };
